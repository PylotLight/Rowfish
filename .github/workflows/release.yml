name: release

# Publish only after an intentional vX.Y.Z tag push. CI and manual mac-package runs never publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Rowfish · Release · mac build · ${{ github.ref_name }}"
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Verify release tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [[ ! "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be vX.Y.Z or a SemVer prerelease; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $tag_version does not match package.json version $package_version" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Package Mac apps
        run: bun run dist:ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Generate SHA-256 checksums
        run: cd release && shasum -a 256 Rowfish-*-mac-arm64.dmg Rowfish-*-mac-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rowfish-macos-release
          path: |
            release/Rowfish-*-mac-arm64.dmg
            release/Rowfish-*-mac-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: "Rowfish · Release · github release · ${{ github.ref_name }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rowfish-macos-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # This repo doubles as the Homebrew tap (brew taps any repo with a Casks/
  # dir via `brew tap pylotlight/rowfish <url>`). The job updates
  # Casks/rowfish.rb on main with the built-in GITHUB_TOKEN, no extra
  # secrets. Token pushes don't re-trigger workflows, so no loop.
  homebrew:
    name: "Rowfish · Release · homebrew cask · ${{ github.ref_name }}"
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          name: rowfish-macos-release
          path: dist
      - name: Resolve version and checksum
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "sha256=$(shasum -a 256 "dist/Rowfish-${version}-mac-arm64.zip" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
      - name: Render cask
        run: |
          bun scripts/render-cask.ts \
            --version "${{ steps.meta.outputs.version }}" \
            --sha256 "${{ steps.meta.outputs.sha256 }}" \
            --out Casks/rowfish.rb
      - name: Commit and push cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rowfish.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "chore(tap): rowfish ${{ steps.meta.outputs.version }}"
            git push
          fi
